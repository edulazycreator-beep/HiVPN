org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Application identity. The applicationId cannot change after the first Play upload,
# so confirm it before publishing (see docs/BUILD_GUIDE.md).
hivpn.applicationId=app.hivpn.android
hivpn.versionName=0.9.0
hivpn.versionCode=2

# Backend (see docs/BUILD_GUIDE.md). All empty = no Hi VPN backend: the app works with
# imported WireGuard configurations only. Set these per environment with -P in CI.
hivpn.apiBaseUrl=
hivpn.directoryPublicKey=
hivpn.apiPins=
