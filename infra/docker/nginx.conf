# TLS front for the public API. Replace api.example.com with your API hostname.
worker_processes auto;
events { worker_connections 2048; }

http {
    # No access log: client IP addresses are not recorded anywhere.
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 51m; # speed-test upload

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    server {
        listen 80;
        server_name api.example.com;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.example.com;

        ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://172.30.0.20:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off; # stream speed-test uploads
            proxy_buffering off;
        }
    }
}
