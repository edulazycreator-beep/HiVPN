name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  # Repository variables (Settings → Secrets and variables → Actions → Variables).
  # Empty values build an app with no Hi VPN backend (imported WireGuard configs only).
  HIVPN_GRADLE_ARGS: >-
    -Phivpn.apiBaseUrl=${{ vars.HIVPN_API_BASE_URL }}
    -Phivpn.directoryPublicKey=${{ vars.HIVPN_DIRECTORY_PUBLIC_KEY }}
    -Phivpn.apiPins=${{ vars.HIVPN_API_PINS }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Build first so a lint or test finding never hides whether the app compiles.
      - name: Debug APK
        run: ./gradlew :app:assembleDebug $HIVPN_GRADLE_ARGS --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hivpn-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :domain:test $HIVPN_GRADLE_ARGS --continue

      - name: Lint
        run: ./gradlew lintDebug $HIVPN_GRADLE_ARGS --continue

      # Print every finding into the job log (report artifacts are not always reachable).
      - name: Print lint and test failures
        if: failure()
        run: |
          find . -path '*lint_intermediate_text_report*' -name '*.txt' -exec sh -c 'grep -q "Error:" "$1" && cat "$1"' _ {} \;
          find . -path '*/test-results/*' -name '*.xml' -exec grep -l '<failure' {} \; | xargs -r cat

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: "**/build/reports/**"

  release:
    name: Signed release APK + AAB
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The keystore exists only for the length of this job, decoded from a secret.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HIVPN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::HIVPN_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HIVPN_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        env:
          HIVPN_KEYSTORE_PASSWORD: ${{ secrets.HIVPN_KEYSTORE_PASSWORD }}
          HIVPN_KEY_ALIAS: ${{ secrets.HIVPN_KEY_ALIAS }}
          HIVPN_KEY_PASSWORD: ${{ secrets.HIVPN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease $HIVPN_GRADLE_ARGS --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hivpn-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --title "Hi VPN ${{ github.ref_name }}" \
            --generate-notes
