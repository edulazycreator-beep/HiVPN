name: Backend

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/**", "infra/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "infra/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hivpn
          POSTGRES_USER: hivpn
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hivpn" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Resolve dependencies
        run: go mod tidy
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Migrations apply cleanly
        env:
          HIVPN_DATABASE_URL: postgres://hivpn:ci-only-password@localhost:5432/hivpn?sslmode=disable
        run: |
          export HIVPN_TOKEN_SECRET=$(openssl rand -hex 32) HIVPN_ACCOUNT_PEPPER=$(openssl rand -hex 32)
          go run ./cmd/api keygen /tmp/dir.pem
          export HIVPN_DIRECTORY_KEY=/tmp/dir.pem
          go run ./cmd/api migrate
          go run ./cmd/api migrate   # second run must be a no-op
      - name: Shell scripts
        working-directory: infra/scripts
        run: bash -n bootstrap-node.sh && bash -n node-ca.sh

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/hivpn-api:${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Node agent binary
        working-directory: backend
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o hivpn-nodeagent-linux-amd64 ./cmd/nodeagent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o hivpn-nodeagent-linux-arm64 ./cmd/nodeagent
      - uses: actions/upload-artifact@v4
        with:
          name: hivpn-nodeagent-${{ github.ref_name }}
          path: backend/hivpn-nodeagent-*
